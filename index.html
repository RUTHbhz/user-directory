<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <h1>User Directory</h1>
        <p class="intro">Search people by name or email. Each card shows their city and organization.</p>
      </div>
    </header>

    <main class="wrap">
      <form id="directory-controls" class="controls" role="search">
        <label class="search-label" for="search-input">Search</label>
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Search by name or email"
          autocomplete="off"
          disabled
        >
        <button id="reload-button" class="reload-button" type="button">Load users</button>
      </form>

      <p id="message" class="message loading" role="status" aria-live="polite">
        Loading users…
      </p>

      <section id="user-list" class="user-list" aria-label="Users"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
